<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pasien | UPTD Puskesmas Sei Taiwan</title>
  
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS Utama -->
  <link rel="stylesheet" href="style-login.css">

  <!-- Override Background Langsung di HTML -->
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                  url("Foto Puskesmas Sei Taiwan.jpg") no-repeat center center / cover !important;
      background-attachment: fixed !important;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="logo-puskesmas.png" alt="Logo Puskesmas" class="logo-img">
      <h2>Sistem Informasi</h2>
      <h3>Puskesmas Sebatik</h3>
    </div>

    <div class="form-title">
      <h4>Form Login</h4>
    </div>

    <form action="dashboard.html" method="GET">
      <div class="form-group">
        <label for="username">Username / NIK Pasien</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="username" placeholder="Masukkan Username atau NIK" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="Masukkan Password" required>
        </div>
      </div>

      <button type="submit" class="btn-login">Masuk ke Portal</button>
    </form>

    <div class="separator">
      <span>Atau</span>
    </div>

    <button type="button" class="btn-google">
      <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google Logo">
      Masuk dengan Google
    </button>
  </div>

</body>
</html>
